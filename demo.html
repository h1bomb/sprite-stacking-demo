<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sprite Stacking Demo</title>
<style>
  :root {
    --bg: #101218;
    --panel: #181b24;
    --ink: #e8eaf0;
    --muted: #8b93a7;
    --accent: #6ec8ff;
    --line: #2a2e3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    height: 100%;
  }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #wrap {
    width: min(100vw, 480px);
    height: 100vh;
    max-height: 100vh;
    display: flex; flex-direction: column;
    background: #0c0e14;
    box-shadow: 0 0 0 1px #000, 0 20px 80px rgba(0,0,0,.5);
  }
  header {
    padding: 14px 16px 8px;
    background: #14171f;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  header h1 { margin: 0; font-size: 15px; letter-spacing: .12em; font-weight: 700; }
  header p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }
  #stage-box { flex: 1 1 auto; position: relative; background: #12141c; overflow: hidden; }
  canvas#view { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #sheet-strip {
    height: 84px; background: #0a0c10; border-top: 1px solid var(--line);
    overflow-x: auto; overflow-y: hidden; display: none; flex: 0 0 auto;
  }
  #sheet-strip.on { display: block; }
  #sheet-strip canvas { display: block; height: 84px; width: auto; image-rendering: pixelated; }
  #ui {
    flex: 0 0 auto; padding: 10px 14px 14px;
    background: var(--panel); border-top: 1px solid var(--line);
    font-size: 12px;
  }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { width: 64px; color: var(--muted); flex: 0 0 64px; }
  .row input[type=range] { flex: 1; }
  .row .val { width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button, .file {
    background: #222632; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px;
  }
  button.active { background: #1d3a52; border-color: #3a7ca8; color: var(--accent); }
  .file input { display: none; }
  #status { margin-top: 8px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>SPRITE STACKING</h1>
    <p>纯 2D 切片堆叠 · 邻近采样 · 可导出 30fps</p>
  </header>
  <div id="stage-box"><canvas id="view"></canvas></div>
  <div id="sheet-strip"><canvas id="strip"></canvas></div>
  <div id="ui">
    <div class="row"><label>转向 turn</label><input id="turn" type="range" min="0" max="360" step="0.5" value="38"><span class="val" id="turnV">38°</span></div>
    <div class="row"><label>俯仰 squash</label><input id="squash" type="range" min="0.50" max="1.00" step="0.01" value="0.75"><span class="val" id="squashV">0.75</span></div>
    <div class="row"><label>层距 spacing</label><input id="spacing" type="range" min="0" max="10" step="0.05" value="1"><span class="val" id="spacingV">1.00</span></div>
    <div class="toggles">
      <button id="spinBtn" class="active">自动旋转</button>
      <button id="outlineBtn" class="active">统一描边</button>
      <button id="sheetBtn">切片条</button>
      <button id="scanBtn">扫描线</button>
      <label class="file">加载切片表<input id="file" type="file" accept="image/png,image/webp"></label>
    </div>
    <div id="status">loading…</div>
  </div>
</div>
<script>
(() => {
  const view = document.getElementById("view");
  const vctx = view.getContext("2d", { alpha: false });
  const strip = document.getElementById("strip");
  const sctx = strip.getContext("2d");
  const $ = (id) => document.getElementById(id);

  const state = {
    vol: null, count: 0, sw: 0, sh: 0,
    turn: 38 * Math.PI / 180,
    squash: 0.75,
    spacing: 1,
    autoSpin: true,
    outline: true,
    showSheet: false,
    showScan: false,
    scale: 10,
    scanT: 0,
    last: performance.now(),
    sheetImg: null,
  };

  function nearestCtx(ctx) {
    ctx.imageSmoothingEnabled = false;
    ctx.imageSmoothingQuality = "low";
  }

  function inferCount(w, h) {
    let best = 0, bestScore = 1e9;
    for (let c = 8; c <= 64; c++) {
      if (w % c !== 0) continue;
      const sl = w / c;
      if (sl < 8 || sl > h * 3) continue;
      // top-view car slices are typically taller than they are wide (~1.7)
      const score = Math.abs(h / sl - 1.7);
      if (score < bestScore) { bestScore = score; best = c; }
    }
    return best;
  }

  function loadSheetFromImage(img, countHint) {
    const w = img.width, h = img.height;
    let count = countHint || 0;
    if (!count) count = inferCount(w, h);
    if (!count) throw new Error("cannot infer slice count");
    const sw = w / count, sh = h;
    const slices = [];
    const tmp = document.createElement("canvas");
    tmp.width = sw; tmp.height = sh;
    const tctx = tmp.getContext("2d");
    nearestCtx(tctx);
    for (let z = 0; z < count; z++) {
      tctx.clearRect(0, 0, sw, sh);
      tctx.drawImage(img, z * sw, 0, sw, sh, 0, 0, sw, sh);
      const c = document.createElement("canvas");
      c.width = sw; c.height = sh;
      const cctx = c.getContext("2d");
      nearestCtx(cctx);
      cctx.drawImage(tmp, 0, 0);
      slices.push(c);
    }
    state.vol = slices;
    state.count = count;
    state.sw = sw;
    state.sh = sh;
    state.sheetImg = img;
    $("status").textContent = `${count} slices · ${sw}×${sh} px art  ·  nearest-neighbor`;
    drawStrip();
  }

  function drawStrip() {
    if (!state.sheetImg) return;
    const zoom = 3;
    strip.width = state.sheetImg.width * zoom;
    strip.height = state.sheetImg.height * zoom;
    nearestCtx(sctx);
    sctx.fillStyle = "#0a0c10";
    sctx.fillRect(0, 0, strip.width, strip.height);
    sctx.drawImage(state.sheetImg, 0, 0, strip.width, strip.height);
    sctx.strokeStyle = "rgba(110,200,255,0.35)";
    sctx.lineWidth = 1;
    for (let z = 0; z <= state.count; z++) {
      const x = z * state.sw * zoom + 0.5;
      sctx.beginPath(); sctx.moveTo(x, 0); sctx.lineTo(x, strip.height); sctx.stroke();
    }
  }

  function outlineOf(srcCanvas, widthPx, color) {
    const w = srcCanvas.width, h = srcCanvas.height;
    const out = document.createElement("canvas");
    out.width = w; out.height = h;
    const ctx = out.getContext("2d");
    const src = srcCanvas.getContext("2d").getImageData(0, 0, w, h);
    const dst = ctx.createImageData(w, h);
    const s = src.data, d = dst.data;
    const r = color[0], g = color[1], b = color[2], a = color[3] ?? 255;
    const opaque = new Uint8Array(w * h);
    for (let i = 0, p = 0; i < s.length; i += 4, p++) opaque[p] = s[i + 3] > 0 ? 1 : 0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const p = y * w + x;
        if (opaque[p]) {
          const i = p * 4;
          d[i] = s[i]; d[i+1] = s[i+1]; d[i+2] = s[i+2]; d[i+3] = s[i+3];
          continue;
        }
        let hit = false;
        const x0 = Math.max(0, x - widthPx), x1 = Math.min(w - 1, x + widthPx);
        const y0 = Math.max(0, y - widthPx), y1 = Math.min(h - 1, y + widthPx);
        for (let yy = y0; yy <= y1 && !hit; yy++) {
          for (let xx = x0; xx <= x1; xx++) {
            if (opaque[yy * w + xx]) { hit = true; break; }
          }
        }
        if (hit) {
          const i = p * 4;
          d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = a;
        }
      }
    }
    ctx.putImageData(dst, 0, 0);
    return out;
  }

  function drawStack(ctx, W, H, pose) {
    const { turn, squash, spacing, drop, scale, scan, outline } = pose;
    const cx = Math.round(W / 2);
    const cy = Math.round(H * 0.55);
    nearestCtx(ctx);

    // shadow
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, squash * 0.45);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    const rw = (Math.abs(Math.cos(turn)) * state.sw + Math.abs(Math.sin(turn)) * state.sh) * 0.52 * scale;
    ctx.beginPath();
    ctx.ellipse(0, 0, rw, rw * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const off = document.createElement("canvas");
    off.width = W; off.height = H;
    const octx = off.getContext("2d");
    nearestCtx(octx);

    for (let z = 0; z < state.count; z++) {
      const lift = Math.round(z * spacing * scale) + Math.round((drop && drop[z] || 0) * scale);
      octx.save();
      octx.translate(cx, cy - lift);
      octx.scale(1, squash);
      octx.rotate(turn);
      const dw = state.sw * scale, dh = state.sh * scale;
      octx.drawImage(state.vol[z], 0, 0, state.sw, state.sh, Math.floor(-dw / 2), Math.floor(-dh / 2), dw, dh);
      // scanline tint
      if (scan && scan.active) {
        const highlight = Math.abs(z - scan.z) < 0.6;
        if (highlight) {
          octx.globalCompositeOperation = "source-atop";
          octx.fillStyle = scan.z % 2 === 0 ? "rgba(255,140,40,0.35)" : "rgba(40,140,255,0.35)";
          octx.fillRect(Math.floor(-dw / 2), Math.floor(-dh / 2), dw, dh);
          octx.globalCompositeOperation = "source-over";
        }
      }
      octx.restore();
    }

    let sprite = off;
    if (outline) {
      const widthPx = Math.max(1, Math.round(scale / 8));
      sprite = outlineOf(off, widthPx, [14, 16, 20, 255]);
    }
    ctx.drawImage(sprite, 0, 0);

    if (scan && scan.active) {
      // horizontal scan ruler across the stack
      const y = cy - Math.round(scan.z * spacing * scale);
      ctx.fillStyle = "rgba(255,160,40,0.85)";
      ctx.fillRect(cx - 200, y, 400, 2);
    }
  }

  function paintScene(ctx, W, H, pose, chrome) {
    ctx.fillStyle = "#12141c";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,0.03)";
    for (let x = 0; x < W; x += 40) ctx.fillRect(x, 0, 1, H);
    for (let y = 0; y < H; y += 40) ctx.fillRect(0, y, W, 1);
    if (!state.vol) return;
    drawStack(ctx, W, H, pose);
    if (chrome) {
      ctx.fillStyle = "#14171f";
      ctx.fillRect(0, 0, W, 90);
      ctx.fillStyle = "#e8eaf0";
      ctx.font = "700 22px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("SPRITE STACKING", W / 2, 38);
      ctx.fillStyle = "#8b93a7";
      ctx.font = "14px sans-serif";
      ctx.fillText("纯 2D 切片堆叠", W / 2, 64);
    }
  }

  function currentPose() {
    const drop = new Array(state.count).fill(0);
    const pose = {
      turn: state.turn, squash: state.squash, spacing: state.spacing,
      drop, scale: state.scale, outline: state.outline,
      scan: state.showScan ? { active: true, z: (state.scanT % 1) * (state.count - 1) } : null,
    };
    return pose;
  }

  function layout() {
    const box = document.getElementById("stage-box");
    const r = box.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    view.width = Math.max(1, Math.round(r.width * dpr));
    view.height = Math.max(1, Math.round(r.height * dpr));
    nearestCtx(vctx);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - state.last) / 1000);
    state.last = now;
    if (state.autoSpin) {
      state.turn = (state.turn + dt * 0.7) % (Math.PI * 2);
      $("turn").value = ((state.turn * 180 / Math.PI) % 360).toFixed(1);
      $("turnV").textContent = `${Number($("turn").value).toFixed(1)}°`;
    }
    if (state.showScan) state.scanT += dt * 0.35;
    paintScene(vctx, view.width, view.height, currentPose(), false);
    requestAnimationFrame(frame);
  }

  // ---- deterministic export timeline (same as render_stack.py, 12s) ----
  function easeOutCubic(t) { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { t = Math.max(0, Math.min(1, t)); return 3 * t * t - 2 * t * t * t; }

  function poseAt(t) {
    const n = state.count;
    const turn0 = 38 * Math.PI / 180;
    const drop = new Array(n).fill(0);
    let turn = turn0, squash = 0.75, spacing = 1, label = "";
    if (t < 2.5) {
      for (let z = 0; z < n; z++) {
        const delay = (z / Math.max(n - 1, 1)) * 0.45;
        const local = easeOutCubic(Math.max(0, Math.min(1, (t / 2.5 - delay) / (1 - 0.45))));
        drop[z] = (1 - local) * 72;
      }
      label = "01  切片降落组装";
    } else if (t < 6.5) {
      turn = turn0 + ((t - 2.5) / 4.0) * Math.PI * 2;
      label = "02  360° 旋转";
    } else if (t < 9.0) {
      const u = (t - 6.5) / 2.5;
      spacing = u < 0.5
        ? 1 + easeInOut(u / 0.5) * 6
        : 7 - easeInOut((u - 0.5) / 0.5) * 6;
      turn = turn0 + Math.PI * 2;
      label = "03  层距拉开 / 爆炸视图";
    } else {
      const u = (t - 9.0) / 3.0;
      if (u < 0.28) squash = 1;
      else if (u < 0.62) squash = 1 - 0.25 * easeInOut((u - 0.28) / 0.34);
      else squash = 0.75;
      turn = turn0 + Math.PI * 2;
      label = "04  俯仰压缩对比";
    }
    return { turn, squash, spacing, drop, scale: state.scale, outline: true, scan: null, label };
  }

  // Headless deterministic renderer used to export crisp 30fps clips.
  // Returns a PNG data URL of a 1080×1920 frame at time t (seconds).
  window.renderFrame = function renderFrame(t, opts = {}) {
    const W = opts.width || 1080, H = opts.height || 1920;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d", { alpha: false });
    nearestCtx(ctx);
    const pose = poseAt(t);
    if (opts.scale) pose.scale = opts.scale;
    paintScene(ctx, W, H, pose, true);
    ctx.fillStyle = "#14171f";
    ctx.fillRect(0, H - 140, W, 140);
    ctx.fillStyle = "#e8eaf0";
    ctx.font = "20px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(pose.label, W / 2, H - 80);
    const deg = ((pose.turn * 180 / Math.PI) % 360).toFixed(1);
    ctx.fillStyle = "#8b93a7";
    ctx.font = "14px sans-serif";
    ctx.fillText(`turn ${deg}°   squash ${pose.squash.toFixed(2)}   spacing ${pose.spacing.toFixed(2)}`, W / 2, H - 48);
    return c.toDataURL("image/png");
  };
  window.getStackMeta = () => ({ count: state.count, w: state.sw, h: state.sh });

  // UI bindings
  $("turn").oninput = (e) => {
    state.autoSpin = false; $("spinBtn").classList.remove("active");
    state.turn = Number(e.target.value) * Math.PI / 180;
    $("turnV").textContent = `${Number(e.target.value).toFixed(1)}°`;
  };
  $("squash").oninput = (e) => {
    state.squash = Number(e.target.value);
    $("squashV").textContent = Number(e.target.value).toFixed(2);
  };
  $("spacing").oninput = (e) => {
    state.spacing = Number(e.target.value);
    $("spacingV").textContent = Number(e.target.value).toFixed(2);
  };
  $("spinBtn").onclick = () => {
    state.autoSpin = !state.autoSpin;
    $("spinBtn").classList.toggle("active", state.autoSpin);
  };
  $("outlineBtn").onclick = () => {
    state.outline = !state.outline;
    $("outlineBtn").classList.toggle("active", state.outline);
  };
  $("sheetBtn").onclick = () => {
    state.showSheet = !state.showSheet;
    $("sheetBtn").classList.toggle("active", state.showSheet);
    $("sheet-strip").classList.toggle("on", state.showSheet);
    layout();
  };
  $("scanBtn").onclick = () => {
    state.showScan = !state.showScan;
    $("scanBtn").classList.toggle("active", state.showScan);
  };
  $("file").onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => { loadSheetFromImage(img); URL.revokeObjectURL(url); };
    img.src = url;
  };
  window.addEventListener("resize", layout);

  function tryLoad(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  layout();
  (async () => {
    async function loadMeta(jsonSrc) {
      try {
        const r = await fetch(jsonSrc);
        if (r.ok) return await r.json();
      } catch (err) {}
      return null;
    }
    const candidates = [
      ["code_car_slices.png", "code_car_slices.json"],
      ["code_model/code_car_slices.png", "code_model/code_car_slices.json"],
      ["slices.png", "slices.json"],
    ];
    for (const [src, jsonSrc] of candidates) {
      try {
        const img = await tryLoad(src);
        const meta = await loadMeta(jsonSrc);
        loadSheetFromImage(img, meta && meta.count);
        break;
      } catch (err) { /* try next */ }
    }
    if (!state.vol) $("status").textContent = "请用「加载切片表」打开一张 slices.png";
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
